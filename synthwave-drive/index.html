<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthwave Drive — Lively Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05010f; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script src="lib/three.min.js"></script>

<script>

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x3a0f5a, 80, 260);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 6.5, 18);
camera.lookAt(0, 9, -60);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

// ------- sky gradient
function gradientTexture() {
  const c = document.createElement('canvas'); c.width = 8; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0.0, '#05010f');
  grd.addColorStop(0.45, '#2a0a4a');
  grd.addColorStop(0.72, '#7a1550');
  grd.addColorStop(1.0, '#ff5e7a');
  g.fillStyle = grd; g.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = gradientTexture();

// ------- retro sun
function sunTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#fff2a8'); grd.addColorStop(0.5, '#ffb14a'); grd.addColorStop(1, '#ff2d8d');
  g.beginPath(); g.arc(128, 128, 124, 0, Math.PI * 2); g.closePath(); g.fillStyle = grd; g.fill();
  g.globalCompositeOperation = 'destination-out';
  for (let y = 138; y < 256; y += 26) g.fillRect(0, y, 256, 5 + (y - 138) * 0.12);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const sun = new THREE.Mesh(
  new THREE.PlaneGeometry(64, 64),
  new THREE.MeshBasicMaterial({ map: sunTexture(), transparent: true, depthWrite: false, fog: false })
);
sun.position.set(0, 20, -190);
scene.add(sun);

// ------- ground + moving grid
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshBasicMaterial({ color: 0x0a0512 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);

const gridSize = 600, divisions = 150, cell = gridSize / divisions;
const grid = new THREE.GridHelper(gridSize, divisions, 0xff2d8d, 0x8a5cff);
grid.material.transparent = true; grid.material.opacity = 0.8;
scene.add(grid);

// ------- low-poly mountains
const mtnMat = new THREE.MeshStandardMaterial({ color: 0x1a0733, emissive: 0x3a1060, emissiveIntensity: 0.5, flatShading: true, roughness: 1 });
for (let i = 0; i < 34; i++) {
  const h = 12 + Math.random() * 34;
  const m = new THREE.Mesh(new THREE.ConeGeometry(8 + Math.random() * 11, h, 4), mtnMat);
  m.position.set(-250 + i * 15 + Math.random() * 6, h / 2 - 2, -150 - Math.random() * 50);
  m.rotation.y = Math.random() * Math.PI;
  scene.add(m);
}

// ------- stars
const stars = [];
for (let i = 0; i < 700; i++) {
  stars.push((Math.random() - 0.5) * 700, 20 + Math.random() * 130, -80 - Math.random() * 320);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(stars), 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, transparent: true, opacity: 0.85, fog: false })));

// ------- lights
scene.add(new THREE.AmbientLight(0x6a3aa0, 1.3));
const dir = new THREE.DirectionalLight(0xff88cc, 1.3);
dir.position.set(-30, 60, 20);
scene.add(dir);

// ------- pointer parallax
const pointer = { x: 0, y: 0 }, target = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  target.x = (e.clientX / innerWidth) * 2 - 1;
  target.y = (e.clientY / innerHeight) * 2 - 1;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const SPEED = 26;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // endless forward motion
  grid.position.z = (grid.position.z + SPEED * dt) % cell;

  pointer.x += (target.x - pointer.x) * 0.05;
  pointer.y += (target.y - pointer.y) * 0.05;
  camera.position.x = pointer.x * 4;
  camera.position.y = 6.5 - pointer.y * 1.6;
  camera.lookAt(pointer.x * 2, 9, -60);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
