<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Factory — Lively Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script src="lib/three.min.js"></script>

<script>

// ---------------------------------------------------------------- renderer/scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 24, 62);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
const camBase = new THREE.Vector3(0, 6.6, 15.5);
camera.position.copy(camBase);
camera.lookAt(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0x88bbff, 0x05070d, 0.55));

const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(-9, 16, 9);
scene.add(key);

const pink = new THREE.PointLight(0xff2d8d, 70, 45, 2);
pink.position.set(-11, 6, -4);
scene.add(pink);

const cyan = new THREE.PointLight(0x22e0ff, 70, 45, 2);
cyan.position.set(11, 6, 4);
scene.add(cyan);

// ---------------------------------------------------------------- floor + grid
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshStandardMaterial({ color: 0x080b14, roughness: 0.92, metalness: 0.15 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const grid = new THREE.GridHelper(160, 160, 0x1b6fff, 0x112f4d);
grid.position.y = 0.012;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ---------------------------------------------------------------- conveyor belt
const beltBody = new THREE.Mesh(
  new THREE.BoxGeometry(46, 0.42, 4.4),
  new THREE.MeshStandardMaterial({ color: 0x11141c, roughness: 0.55, metalness: 0.75 })
);
beltBody.position.set(0, 0.33, 0);
scene.add(beltBody);

function makeStripeTexture() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = '#0c1320'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#1d3a5c'; g.fillRect(0, 0, 10, 64);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(26, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
const beltTex = makeStripeTexture();
const beltTop = new THREE.Mesh(
  new THREE.BoxGeometry(46, 0.08, 4.0),
  new THREE.MeshStandardMaterial({
    map: beltTex, color: 0xffffff, emissive: 0x0a2a44, emissiveIntensity: 0.7,
    roughness: 0.5, metalness: 0.8
  })
);
beltTop.position.set(0, 0.58, 0);
scene.add(beltTop);

// side rails (neon)
const railMat = new THREE.MeshStandardMaterial({ color: 0x05070d, emissive: 0x22e0ff, emissiveIntensity: 1.6, roughness: 0.4, metalness: 0.6 });
for (const z of [2.25, -2.25]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(46, 0.12, 0.12), railMat);
  rail.position.set(0, 0.6, z);
  scene.add(rail);
}

// ---------------------------------------------------------------- cars
function createCar(color) {
  const g = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.6, 0.55, 1.15),
    new THREE.MeshStandardMaterial({ color, roughness: 0.22, metalness: 0.9 })
  );
  body.position.y = 0.62;
  g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.25, 0.55, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x090d15, roughness: 0.1, metalness: 0.4, emissive: 0x122033, emissiveIntensity: 0.6 })
  );
  cabin.position.set(-0.15, 1.13, 0);
  g.add(cabin);

  const skirt = new THREE.Mesh(
    new THREE.BoxGeometry(2.72, 0.16, 1.26),
    new THREE.MeshStandardMaterial({ color: 0x04060b, emissive: color, emissiveIntensity: 0.8, roughness: 0.4, metalness: 0.7 })
  );
  skirt.position.y = 0.34;
  g.add(skirt);

  const wheelGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.22, 16);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 0.95 });
  for (const x of [0.86, -0.86]) {
    for (const z of [0.62, -0.62]) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.x = Math.PI / 2;
      w.position.set(x, 0.34, z);
      g.add(w);
    }
  }

  const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 3.2 });
  for (const z of [0.38, -0.38]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.16, 0.26), headMat);
    h.position.set(1.31, 0.62, z);
    g.add(h);
  }

  const tailMat = new THREE.MeshStandardMaterial({ color: 0xff2244, emissive: 0xff2244, emissiveIntensity: 3.0 });
  for (const z of [0.38, -0.38]) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.3), tailMat);
    t.position.set(-1.31, 0.62, z);
    g.add(t);
  }

  return g;
}

const cars = [];
const carColors = [0xff2d8d, 0x22e0ff, 0x9dff3a, 0xffb800, 0x8a5cff, 0xff5a1f, 0x36f1cd];
const lanes = [{ z: -0.95, speed: 3.4 }, { z: 0.95, speed: 2.5 }];
for (let i = 0; i < 16; i++) {
  const lane = lanes[i % 2];
  const car = createCar(carColors[i % carColors.length]);
  car.position.set(-22 + Math.random() * 44, 0.62, lane.z);
  car.userData.speed = lane.speed + (Math.random() - 0.5) * 0.3;
  scene.add(car);
  cars.push(car);
}

// ---------------------------------------------------------------- robot arms
const arms = [];
function createArm(x, z) {
  const g = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({ color: 0x1a2130, roughness: 0.35, metalness: 0.95 });
  const hot = new THREE.MeshStandardMaterial({ color: 0xff8a00, roughness: 0.35, metalness: 0.8, emissive: 0xff5500, emissiveIntensity: 0.3 });

  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.72, 0.8, 20), steel);
  base.position.y = 0.4;
  g.add(base);

  const shoulder = new THREE.Group();
  shoulder.position.y = 0.8;
  g.add(shoulder);

  const upper = new THREE.Mesh(new THREE.BoxGeometry(0.34, 2.0, 0.34), hot);
  upper.position.y = 1.0;
  shoulder.add(upper);

  const elbow = new THREE.Group();
  elbow.position.y = 2.0;
  shoulder.add(elbow);

  const fore = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.5, 0.28), hot);
  fore.position.y = 0.75;
  elbow.add(fore);

  const tip = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0x22e0ff, emissive: 0x22e0ff, emissiveIntensity: 3.5 })
  );
  tip.position.y = 1.5;
  elbow.add(tip);

  g.position.set(x, 0.62, z);
  g.userData = { shoulder, elbow, phase: Math.random() * Math.PI * 2 };
  scene.add(g);
  return g;
}
for (let i = -2; i <= 2; i++) {
  const z = (i % 2 === 0) ? 3.0 : -3.0;
  const a = createArm(i * 9, z);
  a.rotation.x = z > 0 ? -0.4 : 0.4;
  arms.push(a);
}

// ---------------------------------------------------------------- pillars + ceiling lights
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x0b1120, roughness: 0.5, metalness: 0.7 });
const stripMat = new THREE.MeshStandardMaterial({ color: 0x00d0ff, emissive: 0x00d0ff, emissiveIntensity: 2.4 });
for (let i = -3; i <= 3; i++) {
  for (const z of [-7, 7]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(1.1, 13, 1.1), pillarMat);
    p.position.set(i * 12, 6.5, z);
    scene.add(p);

    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.14, 8, 0.14), stripMat);
    strip.position.set(i * 12 + (z > 0 ? -0.62 : 0.62), 5.2, z);
    scene.add(strip);
  }
}

const lightBarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xbfe9ff, emissiveIntensity: 2.2 });
for (let i = -3; i <= 3; i++) {
  const bar = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.4), lightBarMat);
  bar.position.set(i * 7, 9.5, 0);
  scene.add(bar);
}

// ---------------------------------------------------------------- sparks (points)
const SPARKS = 320;
const sparkPos = new Float32Array(SPARKS * 3);
const sparkData = [];
for (let i = 0; i < SPARKS; i++) {
  sparkData.push({
    x: (Math.random() - 0.5) * 44, y: 0.7 + Math.random() * 2.2, z: (Math.random() - 0.5) * 3.2,
    vy: 0.6 + Math.random() * 1.7, life: Math.random()
  });
}
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
  color: 0xffcc66, size: 0.09, transparent: true, opacity: 0.9,
  depthWrite: false, blending: THREE.AdditiveBlending
}));
scene.add(sparks);

// ---------------------------------------------------------------- camera parallax
const pointer = { x: 0, y: 0 };
const target = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  target.x = (e.clientX / innerWidth) * 2 - 1;
  target.y = (e.clientY / innerHeight) * 2 - 1;
});

// ---------------------------------------------------------------- resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- animate
const clock = new THREE.Clock();
const pos = sparkGeo.attributes.position.array;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // conveyor markings scroll
  beltTex.offset.x -= dt * 0.55;

  // cars flow
  for (const car of cars) {
    car.position.x += car.userData.speed * dt;
    if (car.position.x > 23) car.position.x = -23;
  }

  // robot arms
  for (const arm of arms) {
    const { shoulder, elbow, phase } = arm.userData;
    shoulder.rotation.z = Math.sin(t * 1.2 + phase) * 0.55;
    elbow.rotation.z = -0.55 + Math.sin(t * 2.1 + phase + 1) * 0.7;
  }

  // sparks
  for (let i = 0; i < SPARKS; i++) {
    const s = sparkData[i];
    if (s.life <= 0) {
      s.x = -16 + Math.random() * 32;
      s.y = 0.72;
      s.z = (Math.random() - 0.5) * 3.4;
      s.vy = 0.6 + Math.random() * 1.7;
      s.life = 0.4 + Math.random() * 0.9;
    }
    s.life -= dt;
    s.y += s.vy * dt;
    pos[i * 3] = s.x;
    pos[i * 3 + 1] = s.y;
    pos[i * 3 + 2] = s.z;
  }
  sparkGeo.attributes.position.needsUpdate = true;

  // neon light breathing
  pink.intensity = 60 + Math.sin(t * 1.7) * 18;
  cyan.intensity = 60 + Math.cos(t * 1.3) * 18;

  // parallax camera
  pointer.x += (target.x - pointer.x) * 0.05;
  pointer.y += (target.y - pointer.y) * 0.05;
  camera.position.x = camBase.x + pointer.x * 3.2;
  camera.position.y = camBase.y - pointer.y * 1.6;
  camera.lookAt(pointer.x * 1.6, 1.7, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
