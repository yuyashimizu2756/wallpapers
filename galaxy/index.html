<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral Galaxy — Lively Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03040a; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script src="lib/three.min.js"></script>

<script>

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 6000);
camera.position.set(0, 55, 150);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x03040a, 1);
document.getElementById('app').appendChild(renderer.domElement);

function dotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.beginPath(); g.arc(32, 32, 32, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const dot = dotTexture();

// ------- spiral galaxy
const galaxy = new THREE.Group();
scene.add(galaxy);

const COUNT = 55000, ARMS = 4, RADIUS = 230;
const pos = new Float32Array(COUNT * 3);
const col = new Float32Array(COUNT * 3);
const cInner = new THREE.Color('#fff0b8');
const cMid = new THREE.Color('#ff7ad9');
const cOuter = new THREE.Color('#4f6bff');
const tmp = new THREE.Color();

for (let i = 0; i < COUNT; i++) {
  const r = Math.pow(Math.random(), 0.55) * RADIUS;
  const arm = (i % ARMS) * (Math.PI * 2 / ARMS);
  const spin = r * 0.014;
  const scatter = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * r * 0.22;
  const angle = arm + spin + scatter * 0.08;
  pos[i * 3] = Math.cos(angle) * r + (Math.random() - 0.5) * 16;
  pos[i * 3 + 1] = (Math.random() - 0.5) * Math.pow(1 - r / RADIUS, 2) * 34 + (Math.random() - 0.5) * 4;
  pos[i * 3 + 2] = Math.sin(angle) * r + (Math.random() - 0.5) * 16;

  const t = r / RADIUS;
  if (t < 0.5) tmp.copy(cInner).lerp(cMid, t / 0.5);
  else tmp.copy(cMid).lerp(cOuter, (t - 0.5) / 0.5);
  col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
}
const galaxyGeo = new THREE.BufferGeometry();
galaxyGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
galaxyGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
galaxy.add(new THREE.Points(galaxyGeo, new THREE.PointsMaterial({
  map: dot, vertexColors: true, size: 2.4, sizeAttenuation: true,
  transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending
})));

// ------- glowing core
const core = new THREE.Sprite(new THREE.SpriteMaterial({
  map: dot, color: 0xffe6a8, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
}));
core.scale.set(90, 90, 1);
galaxy.add(core);

// ------- distant starfield
const sky = new Float32Array(1400 * 3);
for (let i = 0; i < 1400; i++) {
  const v = new THREE.Vector3().randomDirection().multiplyScalar(900 + Math.random() * 1800);
  sky[i * 3] = v.x; sky[i * 3 + 1] = v.y; sky[i * 3 + 2] = v.z;
}
const skyGeo = new THREE.BufferGeometry();
skyGeo.setAttribute('position', new THREE.BufferAttribute(sky, 3));
scene.add(new THREE.Points(skyGeo, new THREE.PointsMaterial({
  map: dot, color: 0x9fc4ff, size: 3, sizeAttenuation: true,
  transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending
})));

// ------- pointer parallax
const pointer = { x: 0, y: 0 }, target = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  target.x = (e.clientX / innerWidth) * 2 - 1;
  target.y = (e.clientY / innerHeight) * 2 - 1;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  galaxy.rotation.y += dt * 0.05;

  pointer.x += (target.x - pointer.x) * 0.04;
  pointer.y += (target.y - pointer.y) * 0.04;

  const angle = t * 0.04;
  const orbit = 165;
  camera.position.x = Math.sin(angle) * orbit + pointer.x * 22;
  camera.position.z = Math.cos(angle) * orbit;
  camera.position.y = 60 - pointer.y * 18;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
